name = "huanfa-logistics"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[env.production]

[[env.production.analytics_engine_datasets]]
binding = "CONVERSIONS"
dataset = "huanfa_conversions"

[[redirects]]
from = "/api/*"
to = "/api/:splat"
status = 200
